{% extends "base.html" %}
{% load static %}

{% block title %}Password updated | Makao{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="container auth-container auth-container--narrow">

        <div class="auth-panel auth-panel--center">
            <p class="auth-eyebrow">Success</p>
            <h1 class="auth-title">Password updated</h1>
            <p class="auth-sub">You can now log in with your new password.</p>
            <a href="{% url 'account_login' %}" class="btn btn-primary">Log in</a>
        </div>

    </div>
</section>

{% endblock %}
